<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LED Display Control - Status</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <h1>LED Display Control Panel</h1>
        <nav>
          <a href="/" class="active">Status</a>
          <a href="/teams">Team Settings</a>
          <a href="/display">Display Settings</a>
        </nav>
      </div>
    </header>

    <div class="container">
      <div id="alert-container"></div>

      <!-- Display mode selector (only visible when running under display_manager) -->
      <div id="mode-section" style="display: none">
        <div class="card">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 12px;
            "
          >
            <h2 style="margin: 0">Display Mode</h2>
            <button
              id="power-toggle-mode"
              onclick="toggleDisplayPower()"
              class="power-btn power-on"
              title="Toggle display power"
            >
              Display On
            </button>
          </div>
          <div
            id="mode-status-bar"
            style="margin-bottom: 12px; font-size: 13px; color: #7f8c8d"
          >
            Loading…
          </div>
          <div
            id="mode-radio-group"
            style="
              display: flex;
              gap: 12px;
              flex-wrap: wrap;
              margin-bottom: 16px;
            "
          ></div>
          <div style="margin-top: 14px; margin-bottom: 4px">
            <button
              onclick="applyModeSwitch()"
              class="btn"
              style="margin-right: 8px"
            >
              Apply &amp; Switch
            </button>
            <span
              id="mode-switch-status"
              style="font-size: 13px; color: #7f8c8d"
            ></span>
          </div>
          <div id="mode-settings-panel"></div>
        </div>
      </div>

      <div id="event-section">
        <div class="grid">
          <div class="card">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
              "
            >
              <h2 style="margin: 0">Current Event</h2>
              <button
                id="power-toggle"
                onclick="toggleDisplayPower()"
                class="power-btn power-on"
                title="Toggle display power"
              >
                Display On
              </button>
            </div>
            <div id="current-event-info">
              <div class="loading">Loading...</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>Available Events</h2>
          <div id="events-list">
            <div class="loading">Loading events...</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // API helper functions
      async function fetchAPI(endpoint) {
        const response = await fetch(endpoint);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        return await response.json();
      }

      // ---------- Display Manager / Mode selection ----------

      let _availableModes = null; // {id: {label}}
      let _selectedMode = null; // mode id string currently selected in radio group
      let _activeMode = null; // mode id string confirmed running

      async function loadModeSection() {
        try {
          const modesData = await fetchAPI("/api/display_modes");
          _availableModes = modesData.modes;
          document.getElementById("mode-section").style.display = "";
        } catch {
          // Not running under display_manager — hide mode section entirely
          document.getElementById("mode-section").style.display = "none";
          return;
        }

        // Build radio buttons
        const group = document.getElementById("mode-radio-group");
        group.innerHTML = Object.entries(_availableModes)
          .map(
            ([id, meta]) => `
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;
                         background:#f4f4f8; padding:8px 14px; border-radius:6px;
                         border:2px solid transparent;" id="mode-label-${id}">
            <input type="radio" name="display_mode" value="${id}"
                   onchange="onModeRadioChange('${id}')">
            ${meta.label}
          </label>`,
          )
          .join("");

        await refreshModeStatus();
      }

      async function refreshModeStatus() {
        try {
          const [activeData, statusData] = await Promise.all([
            fetchAPI("/api/active_mode"),
            fetchAPI("/api/mode_status"),
          ]);
          _activeMode = activeData.active_mode;

          // Select the active radio
          const radio = document.querySelector(
            `input[name=display_mode][value="${_activeMode}"]`,
          );
          if (radio) radio.checked = true;
          if (_selectedMode === null) _selectedMode = _activeMode;

          // Highlight active label
          Object.keys(_availableModes).forEach((id) => {
            const lbl = document.getElementById(`mode-label-${id}`);
            if (lbl)
              lbl.style.borderColor =
                id === _activeMode ? "var(--primary-color)" : "transparent";
          });

          // Status bar
          const running = statusData.running;
          const statusColor = running ? "#27ae60" : "#e74c3c";
          const statusText = running
            ? `Running (pid ${statusData.pid})`
            : `Stopped (exit ${statusData.exit_code})`;
          document.getElementById("mode-status-bar").innerHTML =
            `Active mode: <strong>${_availableModes[_activeMode]?.label || _activeMode}</strong> &mdash; ` +
            `<span style="color:${statusColor}">${statusText}</span>`;

          // Show/hide event section
          document.getElementById("event-section").style.display =
            _activeMode === "display_event" ? "" : "none";

          // Render settings for currently selected mode
          renderModeSettings(_selectedMode || _activeMode);
        } catch (err) {
          console.warn("Could not refresh mode status:", err);
        }
      }

      function onModeRadioChange(id) {
        _selectedMode = id;
        renderModeSettings(id);
      }

      async function renderModeSettings(mode) {
        const panel = document.getElementById("mode-settings-panel");
        if (mode === "athletic_live_scoreboard")
          return renderAlsSettings(panel);
        if (mode === "animation_display") return renderAnimationSettings(panel);
        panel.innerHTML = "";
      }

      async function renderAlsSettings(panel) {
        // Don't overwrite existing inputs — they may contain unsaved edits
        if (document.getElementById("als-name")) return;
        const mode = "athletic_live_scoreboard";
        try {
          const data = await fetchAPI(`/api/mode_settings/${mode}`);
          const s = data.settings;
          panel.innerHTML = `
            <hr style="margin:12px 0; border-color:#eee;">
            <h3 style="margin:0 0 10px;">AthleticLIVE Settings</h3>
            <div style="max-width:480px;">
              <div class="form-group">
                <label for="als-name">Computer Name</label>
                <input id="als-name" type="text" value="${s.name || ""}"
                       placeholder="e.g. FUSHIABOX">
              </div>
              <div class="form-group">
                <label for="als-uuid">UUID</label>
                <input id="als-uuid" type="text" value="${s.uuid || ""}"
                       placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
              </div>
              <div class="form-group">
                <label for="als-interval">Poll Interval (seconds)</label>
                <input id="als-interval" type="number" step="0.5" min="1"
                       value="${s.interval || 3}" style="width:120px;">
              </div>
              <div style="margin-top:10px;">
                <button onclick="saveAlsSettings()" class="btn btn-secondary" style="margin-right:8px;">Save Settings</button>
                <button onclick="setAlsFromUrl()" class="btn btn-secondary" style="margin-right:8px;">Set from URL</button>
                <span id="als-save-status" style="font-size:13px; color:#7f8c8d;"></span>
              </div>
            </div>
            <hr style="margin:12px 0; border-color:#eee;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <h4 style="margin:0; font-size:13px; color:#7f8c8d; text-transform:uppercase; letter-spacing:.05em;">Board Config (live)</h4>
              <button onclick="refreshBoardConfig()" style="font-size:12px; padding:3px 10px;">Refresh</button>
            </div>
            <div id="als-board-config" style="max-width:480px; font-size:13px; color:#555;">
              <em>Loading…</em>
            </div>`;
          refreshBoardConfig();
        } catch (err) {
          panel.innerHTML = `<p style="color:#e74c3c;">Could not load settings: ${err.message}</p>`;
        }
      }

      function setAlsFromUrl() {
        const raw = prompt("Paste the AthleticLIVE scoreboard URL:");
        if (!raw) return;
        let params;
        try {
          params = new URL(raw).searchParams;
        } catch {
          showAlert("Invalid URL.", "error");
          return;
        }
        const name = params.get("name");
        const uuid = params.get("uuid");
        if (!name || !uuid) {
          showAlert(
            "Could not find name and uuid parameters in that URL.",
            "error",
          );
          return;
        }
        document.getElementById("als-name").value = name;
        document.getElementById("als-uuid").value = uuid;
        document.getElementById("als-save-status").textContent =
          "Fields updated — click Save Settings to persist.";
        setTimeout(() => {
          const el = document.getElementById("als-save-status");
          if (el) el.textContent = "";
        }, 5000);
      }

      async function saveAlsSettings() {
        const name = document.getElementById("als-name")?.value.trim();
        const uuid = document.getElementById("als-uuid")?.value.trim();
        const interval = parseFloat(
          document.getElementById("als-interval")?.value,
        );
        const statusEl = document.getElementById("als-save-status");
        if (!name || !uuid) {
          showAlert("Name and UUID are required.", "error");
          return;
        }
        statusEl.textContent = "Saving…";
        try {
          await postAPI("/api/mode_settings/athletic_live_scoreboard", {
            settings: { name, uuid, interval },
          });
          statusEl.textContent = "Saved";
          setTimeout(() => {
            statusEl.textContent = "";
          }, 3000);
        } catch (err) {
          showAlert(`Error saving settings: ${err.message}`, "error");
          statusEl.textContent = "";
        }
      }

      async function refreshBoardConfig() {
        const el = document.getElementById("als-board-config");
        if (!el) return;
        try {
          const d = await fetchAPI("/api/athletic_live/board_config");
          el.innerHTML = `
            <table style="border-collapse:collapse; width:100%;">
              <tr><td style="padding:4px 8px 4px 0; color:#7f8c8d; white-space:nowrap;">Scoreboard Name</td><td style="padding:4px 0;">${escapeHtml(d.name || "—")}</td></tr>
              <tr><td style="padding:4px 8px 4px 0; color:#7f8c8d; white-space:nowrap;">Source Data</td><td style="padding:4px 0;">${escapeHtml(d.documentValue || "—")}</td></tr>
              <tr><td style="padding:4px 8px 4px 0; color:#7f8c8d; white-space:nowrap;">Event ID</td><td style="padding:4px 0;">${escapeHtml(d.documentId || "—")}</td></tr>
            </table>`;
        } catch (err) {
          el.innerHTML = `<span style="color:#e74c3c;">Error: ${escapeHtml(err.message)}</span>`;
        }
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ---------- Animation mode settings ----------

      function formatBytes(n) {
        if (n < 1024) return `${n} B`;
        if (n < 1024 * 1024) return `${(n / 1024).toFixed(0)} KB`;
        return `${(n / (1024 * 1024)).toFixed(1)} MB`;
      }

      async function renderAnimationSettings(panel) {
        // Don't overwrite existing inputs — they may contain unsaved edits
        if (document.getElementById("anim-file")) return;
        try {
          const data = await fetchAPI("/api/mode_settings/animation_display");
          const s = data.settings;
          panel.innerHTML = `
            <hr style="margin:12px 0; border-color:#eee;">
            <h3 style="margin:0 0 10px;">Animation Settings</h3>
            <div style="max-width:480px;">
              <div class="form-group">
                <label for="anim-file">Clip</label>
                <select id="anim-file" style="width:100%;">
                  <option value="">Loading…</option>
                </select>
              </div>
              <div class="form-group">
                <label for="anim-fit">Scaling</label>
                <select id="anim-fit" style="width:100%;">
                  <option value="contain">Contain — fit inside, letterboxed</option>
                  <option value="cover">Cover — fill the panel, cropped</option>
                  <option value="stretch">Stretch — ignore aspect ratio</option>
                </select>
              </div>
              <div class="form-group">
                <label for="anim-fps">Frame Rate (0 = use the clip's own timing)</label>
                <input id="anim-fps" type="number" step="1" min="0" max="60"
                       value="${Number(s.fps) || 0}" style="width:120px;">
              </div>
              <div class="form-group">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                  <input id="anim-loop" type="checkbox" ${s.loop === false ? "" : "checked"}>
                  Loop forever
                </label>
              </div>
              <div style="margin-top:10px;">
                <button onclick="saveAnimationSettings()" class="btn btn-secondary" style="margin-right:8px;">Save Settings</button>
                <button onclick="deleteAnimation()" class="btn btn-secondary" style="margin-right:8px;">Delete Clip</button>
                <span id="anim-save-status" style="font-size:13px; color:#7f8c8d;"></span>
              </div>
            </div>
            <hr style="margin:12px 0; border-color:#eee;">
            <h4 style="margin:0 0 8px; font-size:13px; color:#7f8c8d; text-transform:uppercase; letter-spacing:.05em;">Upload</h4>
            <div style="max-width:480px;">
              <input id="anim-upload" type="file"
                     accept=".gif,.webp,.png,.apng,.mp4,.mov,.webm,.mkv,.m4v,.avi">
              <button onclick="uploadAnimation()" class="btn btn-secondary" style="margin-left:8px;">Upload</button>
              <div id="anim-upload-status" style="font-size:13px; color:#7f8c8d; margin-top:6px;"></div>
              <p style="font-size:12px; color:#7f8c8d; margin:8px 0 0;">
                GIF, APNG and WebP work out of the box. Video needs ffmpeg
                installed on the Pi (<code>sudo apt install ffmpeg</code>).
              </p>
            </div>`;
          document.getElementById("anim-fit").value = s.fit || "contain";
          await refreshAnimationList(s.file || "");
        } catch (err) {
          panel.innerHTML = `<p style="color:#e74c3c;">Could not load settings: ${escapeHtml(err.message)}</p>`;
        }
      }

      async function refreshAnimationList(selected) {
        const select = document.getElementById("anim-file");
        if (!select) return;
        const keep = selected !== undefined ? selected : select.value;
        try {
          const data = await fetchAPI("/api/animations");
          if (!data.animations.length) {
            select.innerHTML = `<option value="">No clips uploaded yet</option>`;
            return;
          }
          select.innerHTML = data.animations
            .map(
              (a) =>
                `<option value="${escapeHtml(a.name)}">${escapeHtml(a.name)} (${formatBytes(a.size)})</option>`,
            )
            .join("");
          if (keep) select.value = keep;
          // A configured clip that no longer exists leaves the select blank;
          // surface it rather than silently selecting something else.
          if (!select.value && keep) {
            select.insertAdjacentHTML(
              "afterbegin",
              `<option value="${escapeHtml(keep)}">${escapeHtml(keep)} (missing)</option>`,
            );
            select.value = keep;
          }
        } catch (err) {
          select.innerHTML = `<option value="">Error: ${escapeHtml(err.message)}</option>`;
        }
      }

      function collectAnimationSettings() {
        const file = document.getElementById("anim-file")?.value || "";
        return {
          file,
          fit: document.getElementById("anim-fit")?.value || "contain",
          fps: parseFloat(document.getElementById("anim-fps")?.value) || 0,
          loop: !!document.getElementById("anim-loop")?.checked,
        };
      }

      async function saveAnimationSettings() {
        const statusEl = document.getElementById("anim-save-status");
        const settings = collectAnimationSettings();
        if (!settings.file) {
          showAlert("Select a clip first.", "error");
          return;
        }
        statusEl.textContent = "Saving…";
        try {
          await postAPI("/api/mode_settings/animation_display", { settings });
          statusEl.textContent = "Saved";
          setTimeout(() => {
            statusEl.textContent = "";
          }, 3000);
        } catch (err) {
          showAlert(`Error saving settings: ${err.message}`, "error");
          statusEl.textContent = "";
        }
      }

      async function uploadAnimation() {
        const input = document.getElementById("anim-upload");
        const statusEl = document.getElementById("anim-upload-status");
        const file = input?.files?.[0];
        if (!file) {
          showAlert("Choose a file to upload.", "error");
          return;
        }
        statusEl.textContent = `Uploading ${file.name}…`;
        const body = new FormData();
        body.append("file", file);
        try {
          const response = await fetch("/api/upload/animation", {
            method: "POST",
            body,
          });
          const result = await response.json();
          if (!response.ok)
            throw new Error(result.error || `HTTP ${response.status}`);
          statusEl.textContent = "";
          input.value = "";
          showAlert(
            `${result.replaced ? "Replaced" : "Uploaded"} ${result.name}`,
          );
          await refreshAnimationList(result.name);
        } catch (err) {
          statusEl.textContent = "";
          showAlert(`Upload failed: ${err.message}`, "error");
        }
      }

      async function deleteAnimation() {
        const select = document.getElementById("anim-file");
        const name = select?.value;
        if (!name) return;
        if (!confirm(`Delete ${name}? This cannot be undone.`)) return;
        try {
          const response = await fetch(
            `/api/animations/${encodeURIComponent(name)}`,
            { method: "DELETE" },
          );
          const result = await response.json();
          if (!response.ok)
            throw new Error(result.error || `HTTP ${response.status}`);
          showAlert(`Deleted ${result.name}`);
          await refreshAnimationList("");
        } catch (err) {
          showAlert(`Delete failed: ${err.message}`, "error");
        }
      }

      async function applyModeSwitch() {
        const mode = _selectedMode || _activeMode;
        if (!mode) return;
        const statusEl = document.getElementById("mode-switch-status");
        statusEl.textContent = "Saving…";

        // Persist athletic_live settings before switching
        if (mode === "athletic_live_scoreboard") {
          const name = document.getElementById("als-name")?.value.trim();
          const uuid = document.getElementById("als-uuid")?.value.trim();
          const interval = parseFloat(
            document.getElementById("als-interval")?.value,
          );
          if (!name || !uuid) {
            showAlert(
              "Name and UUID are required for AthleticLIVE mode.",
              "error",
            );
            statusEl.textContent = "";
            return;
          }
          try {
            await postAPI(`/api/mode_settings/${mode}`, {
              settings: { name, uuid, interval },
            });
          } catch (err) {
            showAlert(`Error saving settings: ${err.message}`, "error");
            statusEl.textContent = "";
            return;
          }
        }

        // Persist animation settings before switching
        if (mode === "animation_display") {
          const settings = collectAnimationSettings();
          if (!settings.file) {
            showAlert(
              "Upload and select a clip before switching to Animation.",
              "error",
            );
            statusEl.textContent = "";
            return;
          }
          try {
            await postAPI(`/api/mode_settings/${mode}`, { settings });
          } catch (err) {
            showAlert(`Error saving settings: ${err.message}`, "error");
            statusEl.textContent = "";
            return;
          }
        }

        try {
          await postAPI("/api/active_mode", { mode });
          showAlert(`Switched to: ${_availableModes[mode]?.label || mode}`);
          statusEl.textContent = "";
          // Wait briefly for child to start, then refresh status
          setTimeout(refreshModeStatus, 1500);
        } catch (err) {
          showAlert(`Error switching mode: ${err.message}`, "error");
          statusEl.textContent = "";
        }
      }

      // Auto-refresh mode status every 10 seconds
      setInterval(() => {
        if (_availableModes) refreshModeStatus();
      }, 10000);

      async function postAPI(endpoint, data) {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || `HTTP ${response.status}`);
        }
        return await response.json();
      }

      function showAlert(message, type = "success") {
        const container = document.getElementById("alert-container");
        const alertClass = type === "success" ? "alert-success" : "alert-error";
        container.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
        setTimeout(() => {
          container.innerHTML = "";
        }, 5000);
      }

      // Load current event
      async function loadCurrentEvent() {
        try {
          const data = await fetchAPI("/api/current_event");
          const info = document.getElementById("current-event-info");
          info.innerHTML = `
                    <div style="font-size: 18px; font-weight: 500; margin-bottom: 15px;">
                        <span class="status-badge status-active">Active</span>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                        <div>
                            <label style="font-weight: 500; color: #7f8c8d;">Event</label>
                            <div style="font-size: 24px; font-weight: 600; color: var(--primary-color);">${data.event}</div>
                        </div>
                        <div>
                            <label style="font-weight: 500; color: #7f8c8d;">Round</label>
                            <div style="font-size: 24px; font-weight: 600; color: var(--primary-color);">${data.round}</div>
                        </div>
                        <div>
                            <label style="font-weight: 500; color: #7f8c8d;">Heat</label>
                            <div style="font-size: 24px; font-weight: 600; color: var(--primary-color);">${data.heat}</div>
                        </div>
                    </div>
                `;
          return data;
        } catch (error) {
          document.getElementById("current-event-info").innerHTML =
            `<div class="alert alert-error">Error loading current event: ${error.message}</div>`;
          return null;
        }
      }

      // Load events list
      async function loadEvents() {
        try {
          const data = await fetchAPI("/api/events");
          const currentEvent = await loadCurrentEvent();

          const container = document.getElementById("events-list");

          if (data.events.length === 0) {
            container.innerHTML = "<p>No events found in lynx.evt file.</p>";
            return;
          }

          const eventsHTML = data.events
            .map((event) => {
              const isActive =
                currentEvent &&
                event.event === currentEvent.event &&
                event.round === currentEvent.round &&
                event.heat === currentEvent.heat;

              const scheduleInfo = event.schedule_position
                ? `<span style="color: #3498db; font-weight: 500;"> (Position ${event.schedule_position} of ${event.total_scheduled})</span>`
                : "";

              return `
                        <div class="event-item ${isActive ? "active" : ""}" 
                             onclick="selectEvent(${event.event}, ${
                               event.round
                             }, ${event.heat})">
                            <div class="event-header">
                                Event ${event.event} - Round ${
                                  event.round
                                } - Heat ${event.heat}${scheduleInfo}
                            </div>
                            <div style="margin-top: 5px; font-weight: 500;">${
                              event.name
                            }</div>
                            <div class="event-details">
                                ${event.athlete_count} athlete${
                                  event.athlete_count !== 1 ? "s" : ""
                                }
                            </div>
                        </div>
                    `;
            })
            .join("");

          container.innerHTML = `<div class="event-list">${eventsHTML}</div>`;
        } catch (error) {
          document.getElementById("events-list").innerHTML =
            `<div class="alert alert-error">Error loading events: ${error.message}</div>`;
        }
      }

      // Select event
      async function selectEvent(event, round, heat) {
        try {
          await postAPI("/api/current_event", { event, round, heat });
          showAlert(
            `Event ${event}, Round ${round}, Heat ${heat} selected successfully!`,
          );
          // Reload to update UI
          await loadEvents();
        } catch (error) {
          showAlert(`Error selecting event: ${error.message}`, "error");
        }
      }

      // Display power control
      let displayPowerOn = true;

      async function loadDisplayPower() {
        try {
          const data = await fetchAPI("/api/display_power");
          displayPowerOn = data.power;
          updatePowerButton();
        } catch (error) {
          console.error("Error loading display power state:", error);
        }
      }

      function updatePowerButton() {
        for (const id of ["power-toggle", "power-toggle-mode"]) {
          const btn = document.getElementById(id);
          if (!btn) continue;
          if (displayPowerOn) {
            btn.textContent = "Display On";
            btn.className = "power-btn power-on";
          } else {
            btn.textContent = "Display Off";
            btn.className = "power-btn power-off";
          }
        }
      }

      async function toggleDisplayPower() {
        try {
          const newState = !displayPowerOn;
          await postAPI("/api/display_power", { power: newState });
          displayPowerOn = newState;
          updatePowerButton();
          showAlert(`Display turned ${newState ? "on" : "off"}`);
        } catch (error) {
          showAlert(`Error toggling display: ${error.message}`, "error");
        }
      }

      // Initialize on page load
      document.addEventListener("DOMContentLoaded", () => {
        loadModeSection();
        loadEvents();
        loadDisplayPower();
      });
    </script>
  </body>
</html>
