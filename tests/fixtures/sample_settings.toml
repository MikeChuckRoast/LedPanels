# Sample settings for testing

[hardware]
width = 64
height = 32
chain = 2
parallel = 4
gpio_slowdown = 3

[network]
fpp_enabled = false
fpp_host = "127.0.0.1"
fpp_port = 4048
colorlight_enabled = false
colorlight_interface = "eth0"

[fonts]
font_path = "/path/to/test/fonts"

[files]
colors_file = "colors.csv"

[web]
web_enabled = true
web_host = "0.0.0.0"
web_port = 5000

[mode.display_event]
line_height = 24
header_line_height = 16
header_rows = 2
interval = 2.0
font_shift = 7
font_name = "helvB14.bdf"
lynx_file = "lynx.evt"
once = false
keyboard_device = ""
file_watch_enabled = true
